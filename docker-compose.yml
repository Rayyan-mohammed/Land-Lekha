# Postgres + API (serving the built UI) for a live demo link on a cloud VM.
#
#   echo "LL_JWT_SECRET=$(openssl rand -hex 32)" > .env
#   echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> .env
#   docker compose up --build -d
#
# First start still downloads the EasyOCR models (~100 MB) into the ocr_models volume.
#
# Horizontal scaling: `docker compose up --scale api=3` runs three API replicas sharing
# one Postgres database and one `storage` volume. Every replica polls the database for
# queued documents and claims them atomically (backend/api/processing.py), so this is
# safe - a document can't be double-processed just because more than one replica sees
# it. This only works with Postgres (LL_DATABASE_URL above); the default SQLite mode is
# single-process only and must not be scaled. `ports: "8000:8000"` must become a range
# or be removed in favour of a load balancer/reverse proxy when scale > 1, since compose
# cannot bind the same host port from multiple replicas.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: landlekha
      POSTGRES_USER: landlekha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landlekha"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      LL_DATABASE_URL: postgresql+psycopg://landlekha:${POSTGRES_PASSWORD}@db:5432/landlekha
      LL_JWT_SECRET: ${LL_JWT_SECRET:?set LL_JWT_SECRET in .env}
      LL_CORS_ORIGINS: ${LL_CORS_ORIGINS:-http://localhost:8000}
      LL_SEED_DEMO_USERS: ${LL_SEED_DEMO_USERS:-1}
    ports:
      - "8000:8000"
    volumes:
      - storage:/app/storage
      - ocr_models:/root/.EasyOCR
    restart: unless-stopped

volumes:
  db_data:
  storage:
  ocr_models:
